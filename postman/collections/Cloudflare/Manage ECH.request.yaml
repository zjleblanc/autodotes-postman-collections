$kind: http-request
url: https://api.cloudflare.com/client/v4/zones/{{cloudflare_dns_zone}}/settings/ech
method: PATCH
headers:
  - key: X-Auth-Email
    value: "{{cloudflare_api_email}}"
    disabled: true
body:
  type: json
  content: '{"id": "ech", "value": "off"}'
auth:
  type: apikey
  credentials:
    key: X-Auth-Key
    value: "{{cloudflare_api_key}}"
    in: header
settings: {}
order: 1000
