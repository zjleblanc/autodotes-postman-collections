$kind: http-request
url: https://accounts.spotify.com/api/token
method: POST
body:
  type: urlencoded
  content:
    - key: grant_type
      value: client_credentials
    - key: client_id
      value: "{{spotify_client_id}}"
      disabled: true
    - key: client_secret
      value: "{{spotify_client_secret}}"
      disabled: true
auth:
  type: basic
  credentials:
    username: "{{spotify_client_id}}"
    password: "{{spotify_client_secret}}"
settings: {}
order: 1000
