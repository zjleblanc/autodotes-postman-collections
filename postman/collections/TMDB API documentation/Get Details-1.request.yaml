$kind: http-request
name: Get Details
description: |-
  Get a movie or TV credit details by id.

  #### Recent Changes

  | **Date** | **Change** |
  | - | - |
  | July 13, 2018 | Movie credits are now supported. |
url: "{{baseUrl}}/credit/:credit_id"
method: GET
pathVariables:
  - key: credit_id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Details-1.resources/examples
order: 20000
