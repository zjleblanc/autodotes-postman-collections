$kind: http-request
description: Get all of the lists created by an account. Will invlude private lists if you are the owner.
url: "{{baseUrl}}/account/:account_id/lists?api_key=in fugiat&session_id="
method: GET
queryParams:
  - key: api_key
    value: in fugiat
  - key: session_id
    value: ""
    description: "(Required) "
pathVariables:
  - key: account_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Created Lists.resources/examples
order: 4000
