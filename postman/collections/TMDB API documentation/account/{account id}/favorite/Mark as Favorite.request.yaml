$kind: http-request
description: This method allows you to mark a movie or TV show as a favorite item.
url: "{{baseUrl}}/account/:account_id/favorite?session_id="
method: POST
headers:
  Content-Type: application/json
queryParams:
  - key: session_id
    value: ""
    description: "(Required) "
pathVariables:
  - key: account_id
    value: "24717925"
    description: "(Required) "
body:
  type: text
  content: |-
    {
        "media_type": "movie",
        "media_id": 550,
        "favorite": true
    }
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Mark as Favorite.resources/examples
order: 1000
