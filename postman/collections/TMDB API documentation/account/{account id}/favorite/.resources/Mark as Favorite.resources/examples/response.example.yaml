$kind: http-example
request:
  url: "{{baseUrl}}/account/:account_id/favorite?session_id="
  method: POST
  headers:
    - key: Content-Type
      value: application/json;charset=utf-8
      description: "(Required) "
  queryParams:
    session_id: ""
  pathVariables:
    account_id: ""
  body:
    type: text
    content: |-
      {
          "media_type": "movie",
          "media_id": 550,
          "favorite": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
       "status_code": 12,
       "status_message": "The item/record was updated successfully."
      }
order: 1000
