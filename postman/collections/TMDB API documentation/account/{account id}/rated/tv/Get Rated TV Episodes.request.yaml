$kind: http-request
description: Get a list of all the TV episodes you have rated.
url: "{{baseUrl}}/account/:account_id/rated/tv/episodes?session_id="
method: GET
queryParams:
  - key: session_id
    value: ""
    description: "(Required) "
pathVariables:
  - key: account_id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Rated TV Episodes.resources/examples
order: 2000
