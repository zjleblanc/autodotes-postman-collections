$kind: http-request
description: Get the list translations for a collection by id.
url: "{{baseUrl}}/collection/:collection_id/translations"
method: GET
pathVariables:
  - key: collection_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Translations.resources/examples
order: 3000
