$kind: http-request
description: |-
  Get the external ids for a movie. We currently support the following external sources.

  | **Media Databases** | **Social IDs** |
  | ------------------- | -------------- |
  | IMDb ID             | Facebook       |
  |                     | Instagram      |
  |                     | Twitter        |
url: "{{baseUrl}}/movie/:movie_id/external_ids?api_key=in fugiat"
method: GET
queryParams:
  api_key: in fugiat
pathVariables:
  - key: movie_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get External IDs.resources/examples
order: 4000
