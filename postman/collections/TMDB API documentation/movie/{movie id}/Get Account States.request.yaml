$kind: http-request
description: |-
  Grab the following account states for a session:

  - Movie rating
  - If it belongs to your watchlist
  - If it belongs to your favourite list
url: "{{baseUrl}}/movie/:movie_id/account_states?session_id=&guest_session_id=in fugiat&session_id=in fugiat"
method: GET
queryParams:
  - key: session_id
    value: ""
    description: "(Required) "
  - key: guest_session_id
    value: in fugiat
  - key: session_id
    value: in fugiat
pathVariables:
  - key: movie_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Account States.resources/examples
order: 8000
