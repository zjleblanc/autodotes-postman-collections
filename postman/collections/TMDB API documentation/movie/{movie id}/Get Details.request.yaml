$kind: http-request
description: |-
  Get the primary information about a movie.

  Supports `append_to_response`. Read more about this [here](#docTextSection:JdZq8ctmcxNqyLQjp).

  #### Recent Changes

  | **Date** | **Change** |
  | - | - |
  | November 20, 2020 | A `watch/providers` method has been added to show what providers (eg. streaming) are available and where.|
url: "{{baseUrl}}/movie/:movie_id"
method: GET
pathVariables:
  - key: movie_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Details.resources/examples
order: 2000
