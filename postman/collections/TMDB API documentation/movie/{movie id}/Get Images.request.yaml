$kind: http-request
description: |-
  Get the images that belong to a movie.

  Querying images with a `language` parameter will filter the results. If you want to include a fallback language (especially useful for backdrops) you can use the `include_image_language` parameter. This should be a comma seperated value like so: `include_image_language=en,null`.
url: "{{baseUrl}}/movie/:movie_id/images?include_image_language=in fugiat"
method: GET
queryParams:
  include_image_language: in fugiat
pathVariables:
  - key: movie_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Images.resources/examples
order: 17000
