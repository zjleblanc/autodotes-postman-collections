$kind: http-request
description: |-
  Get a list of similar movies. This is **not** the same as the "Recommendation" system you see on the website.

  These items are assembled by looking at keywords and genres.
url: "{{baseUrl}}/movie/:movie_id/similar?api_key=in fugiat"
method: GET
queryParams:
  api_key: in fugiat
pathVariables:
  - key: movie_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Similar Movies.resources/examples
order: 10000
