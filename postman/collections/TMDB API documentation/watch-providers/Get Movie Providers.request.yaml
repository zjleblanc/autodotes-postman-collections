$kind: http-request
description: Returns a list of the watch provider (OTT/streaming) data we have available for movies. You can specify a `watch_region` param if you want to further filter the list by country.
url: "{{baseUrl}}/watch/providers/movie?watch_region=in fugiat"
method: GET
queryParams:
  - key: watch_region
    value: in fugiat
    description: Use the ISO-3166-1 code to filter the providers that are available in a particular country.
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Movie Providers.resources/examples
order: 3000
