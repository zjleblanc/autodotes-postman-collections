$kind: http-request
description: Get an up to date list of the officially supported TV show certifications on TMDB.
url: "{{baseUrl}}/certification/tv/list"
method: GET
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get TV Certifications.resources/examples
order: 2000
