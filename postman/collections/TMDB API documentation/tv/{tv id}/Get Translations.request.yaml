$kind: http-request
description: Get a list of the translations that exist for a TV show.
url: "{{baseUrl}}/tv/:tv_id/translations"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Translations.resources/examples
order: 8000
