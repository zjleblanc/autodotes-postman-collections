$kind: http-request
description: Get the list of TV show recommendations for this item.
url: "{{baseUrl}}/tv/:tv_id/recommendations"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Recommendations.resources/examples
order: 20000
