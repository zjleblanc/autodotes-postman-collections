$kind: http-request
description: |-
  Get the external ids for a TV episode. We currently support the following external sources.

  | **External Sources** |
  | -------------------- |
  | IMDb ID              |
  | TVDB ID              |
  | Freebase MID*        |
  | Freebase ID*         |
  | TVRage ID*           |

  *Defunct or no longer available as a service.
url: "{{baseUrl}}/tv/:tv_id/season/:season_number/episode/:episode_number/external_ids"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
  - key: season_number
    value: "24717925"
    description: "(Required) "
  - key: episode_number
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get External IDs.resources/examples
order: 3000
