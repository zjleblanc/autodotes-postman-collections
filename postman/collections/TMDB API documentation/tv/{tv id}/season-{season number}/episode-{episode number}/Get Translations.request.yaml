$kind: http-request
description: Get the translation data for an episode.
url: "{{baseUrl}}/tv/:tv_id/season/:season_number/episode/:episode_number/translations"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
  - key: season_number
    value: "24717925"
    description: "(Required) "
  - key: episode_number
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Translations.resources/examples
order: 6000
