$kind: http-request
description: |-
  Get the videos that have been added to a TV episode.

  #### Recent Changes

  | **Date** | **Change** |
  | - | - |
  | July 28, 2021 | A new `include_video_language` filter is now available. You can use this filter the same way you use `include_image_language` on image calls. We also added two new fields, `official` and `published_at` to the video response. |
  | March 23, 2019 | Vimeo was added as a video source. |
  | March 20, 2019 | "Behind the Scenes", "Bloopers" and "Recap" were added as valid video types. |
url: "{{baseUrl}}/tv/:tv_id/season/:season_number/episode/:episode_number/videos"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
  - key: season_number
    value: "24717925"
    description: "(Required) "
  - key: episode_number
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get  Videos.resources/examples
order: 4000
