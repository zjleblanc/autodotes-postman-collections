$kind: http-request
description: |-
  Get the aggregate credits for TV season.

  This call differs from the main `credits` call in that it does not only return the season credits, but rather is a view of all the cast & crew for all of the episodes belonging to a season.
url: "{{baseUrl}}/tv/:tv_id/season/:season_number/aggregate_credits"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
  - key: season_number
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Aggregate Credits.resources/examples
order: 4000
