$kind: http-request
description: |-
  Get the external ids for a TV show. We currently support the following external sources.

  | **Media Databases** | **Social IDs** |
  | ------------------- | -------------- |
  | IMDb ID             | Facebook       |
  | TVDB ID             | Instagram      |
  | Freebase MID*       | Twitter        |
  | Freebase ID*        |                |
  | TVRage ID*          |                |

  *Defunct or no longer available as a service.
url: "{{baseUrl}}/tv/:tv_id/external_ids"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get External IDs.resources/examples
order: 16000
