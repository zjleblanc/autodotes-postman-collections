$kind: http-request
description: |-
  Grab the following account states for a session:

  - TV show rating
  - If it belongs to your watchlist
  - If it belongs to your favourite list
url: "{{baseUrl}}/tv/:tv_id/account_states?guest_session_id=in fugiat&session_id=in fugiat"
method: GET
queryParams:
  guest_session_id: in fugiat
  session_id: in fugiat
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Account States.resources/examples
order: 9000
