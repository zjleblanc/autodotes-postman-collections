$kind: http-request
description: |-
  Remove your rating for a TV show.

  A valid session or guest session ID is required. You can read more about how this works [here](#docTextSection:NSZtgz7zptsiLYxXZ).
url: "{{baseUrl}}/tv/:tv_id/rating?guest_session_id=in fugiat&session_id=in fugiat"
method: DELETE
queryParams:
  guest_session_id: in fugiat
  session_id: in fugiat
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Delete Rating.resources/examples
order: 2000
