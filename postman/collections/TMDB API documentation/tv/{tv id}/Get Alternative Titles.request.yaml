$kind: http-request
description: Returns all of the alternative titles for a TV show.
url: "{{baseUrl}}/tv/:tv_id/alternative_titles"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Alternative Titles.resources/examples
order: 4000
