$kind: http-request
description: Get the keywords that have been added to a TV show.
url: "{{baseUrl}}/tv/:tv_id/keywords"
method: GET
pathVariables:
  - key: tv_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Keywords.resources/examples
order: 15000
