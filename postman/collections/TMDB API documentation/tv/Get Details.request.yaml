$kind: http-request
description: |-
  Get the details of a TV episode group. Groups support 7 different types which are enumerated as the following:

  1. Original air date
  2. Absolute
  3. DVD
  4. Digital
  5. Story arc
  6. Production
  7. TV
url: "{{baseUrl}}/tv/episode_group/:id"
method: GET
pathVariables:
  - key: id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Details.resources/examples
order: 5000
