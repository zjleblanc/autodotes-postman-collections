$kind: http-request
description: Get the most newly created TV show. This is a live response and will continuously change.
url: "{{baseUrl}}/tv/latest"
method: GET
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Latest.resources/examples
order: 3000
