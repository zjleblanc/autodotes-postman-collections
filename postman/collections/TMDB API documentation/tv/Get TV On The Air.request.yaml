$kind: http-request
description: |-
  Get a list of shows that are currently on the air.

  This query looks for any TV show that has an episode with an air date in the next 7 days.
url: "{{baseUrl}}/tv/on_the_air"
method: GET
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get TV On The Air.resources/examples
order: 7000
