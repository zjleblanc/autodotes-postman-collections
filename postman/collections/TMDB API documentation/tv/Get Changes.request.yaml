$kind: http-request
description: |-
  Get the changes for a TV episode. By default only the last 24 hours are returned.

  You can query up to 14 days in a single query by using the `start_date` and `end_date` query parameters.
url: "{{baseUrl}}/tv/episode/:episode_id/changes"
method: GET
pathVariables:
  - key: episode_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Changes.resources/examples
order: 10000
