$kind: http-request
description: |-
  Retrieve the details of a movie or TV show review.

  #### Recent Changes

  | **Date** | **Change** |
  | - | - |
  | November 14, 2020 | A `author_details` field has been added to the default response, which includes an `avatar_path` and `rating` value. |
url: "{{baseUrl}}/review/:review_id"
method: GET
pathVariables:
  - key: review_id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Details.resources/examples
order: 19000
