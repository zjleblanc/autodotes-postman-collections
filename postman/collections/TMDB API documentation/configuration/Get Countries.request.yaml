$kind: http-request
description: Get the list of countries (ISO 3166-1 tags) used throughout TMDB.
url: "{{baseUrl}}/configuration/countries?api_key=in fugiat"
method: GET
queryParams:
  api_key: in fugiat
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Countries.resources/examples
order: 4000
