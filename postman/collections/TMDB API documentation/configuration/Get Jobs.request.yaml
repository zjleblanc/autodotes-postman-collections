$kind: http-request
description: Get a list of the jobs and departments we use on TMDB.
url: "{{baseUrl}}/configuration/jobs?api_key=in fugiat"
method: GET
queryParams:
  api_key: in fugiat
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Jobs.resources/examples
order: 2000
