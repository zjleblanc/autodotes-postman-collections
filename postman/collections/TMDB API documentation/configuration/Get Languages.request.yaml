$kind: http-request
description: Get the list of languages (ISO 639-1 tags) used throughout TMDB.
url: "{{baseUrl}}/configuration/languages?api_key=in fugiat"
method: GET
queryParams:
  api_key: in fugiat
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Languages.resources/examples
order: 6000
