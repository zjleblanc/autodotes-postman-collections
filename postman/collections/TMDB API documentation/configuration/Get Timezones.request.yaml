$kind: http-request
description: Get the list of timezones used throughout TMDB.
url: "{{baseUrl}}/configuration/timezones?api_key=in fugiat"
method: GET
queryParams:
  api_key: in fugiat
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Timezones.resources/examples
order: 3000
