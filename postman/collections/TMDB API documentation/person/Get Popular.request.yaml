$kind: http-request
description: Get the list of popular people on TMDB. This list updates daily.
url: "{{baseUrl}}/person/popular"
method: GET
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Popular.resources/examples
order: 4000
