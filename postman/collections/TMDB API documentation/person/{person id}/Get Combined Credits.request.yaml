$kind: http-request
description: Get the movie and TV credits together in a single response.
url: "{{baseUrl}}/person/:person_id/combined_credits"
method: GET
pathVariables:
  - key: person_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Combined Credits.resources/examples
order: 3000
