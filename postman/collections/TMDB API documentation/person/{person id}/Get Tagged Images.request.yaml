$kind: http-request
description: Get the images that this person has been tagged in.
url: "{{baseUrl}}/person/:person_id/tagged_images"
method: GET
pathVariables:
  - key: person_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Tagged Images.resources/examples
order: 8000
