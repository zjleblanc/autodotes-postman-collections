$kind: http-request
description: |-
  Get the details of a network.

  #### Recent Changes

  | **Date** | **Change** |
  | - | - |
  | November 14, 2020 | The `logo_path` has been added to the default response. |
url: "{{baseUrl}}/network/:network_id"
method: GET
pathVariables:
  - key: network_id
    value: "24717925"
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Details.resources/examples
order: 1000
