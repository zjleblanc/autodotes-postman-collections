$kind: http-request
description: Get the rated movies for a guest session.
url: "{{baseUrl}}/guest_session/:guest_session_id/rated/movies"
method: GET
pathVariables:
  - key: guest_session_id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Rated Movies.resources/examples
order: 2000
