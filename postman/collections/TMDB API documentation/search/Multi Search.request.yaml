$kind: http-request
description: Search multiple models in a single request. Multi search currently supports searching for movies, tv shows and people in a single request.
url: "{{baseUrl}}/search/multi"
method: GET
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Multi Search.resources/examples
order: 7000
