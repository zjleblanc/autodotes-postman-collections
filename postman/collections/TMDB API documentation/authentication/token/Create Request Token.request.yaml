$kind: http-request
description: Create a temporary request token that can be used to validate a TMDB user login. More details about how this works can be found [here](#docTextSection:NSZtgz7zptsiLYxXZ).
url: "{{baseUrl}}/authentication/token/new"
method: GET
auth:
  type: apikey
  credentials:
    value: "{{value}}"
    key: "{{key}}"
    in: query
settings: {}
examples: ./.resources/Create Request Token.resources/examples
order: 1000
