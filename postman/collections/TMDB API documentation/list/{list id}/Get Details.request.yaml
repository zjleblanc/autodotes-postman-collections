$kind: http-request
description: Get the details of a list.
url: "{{baseUrl}}/list/:list_id"
method: GET
pathVariables:
  - key: list_id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Get Details.resources/examples
order: 1000
