$kind: http-request
description: Clear all of the items from a list.
url: "{{baseUrl}}/list/:list_id/clear?confirm=true&session_id="
method: POST
queryParams:
  - key: confirm
    value: "true"
    description: "(Required) "
  - key: session_id
    value: ""
    description: "(Required) "
pathVariables:
  - key: list_id
    value: in fugiat
    description: "(Required) "
auth:
  type: apikey
  credentials:
    key: api_key
    value: "{{api_key}}"
    in: query
settings: {}
examples: ./.resources/Clear List.resources/examples
order: 5000
