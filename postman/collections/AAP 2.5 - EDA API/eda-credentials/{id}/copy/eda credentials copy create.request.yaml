$kind: http-request
description: Copy an EDA credential.
url: "{{instance_fqdn}}/api/eda/v1/eda-credentials/:id/copy/"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this eda credential.
settings: {}
examples: ./.resources/eda credentials copy create.resources/examples
order: 1000
