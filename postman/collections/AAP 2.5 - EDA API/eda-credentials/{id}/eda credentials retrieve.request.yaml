$kind: http-request
description: Get EDA credential by id
url: "{{instance_fqdn}}/api/eda/v1/eda-credentials/:id/?refs=true"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: refs
    value: "true"
    description: Query resources that have reference to the credential by its id
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this eda credential.
settings: {}
examples: ./.resources/eda credentials retrieve.resources/examples
order: 2000
