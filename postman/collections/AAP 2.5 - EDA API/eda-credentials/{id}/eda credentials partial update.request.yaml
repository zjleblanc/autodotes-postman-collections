$kind: http-request
description: Partial update of an EDA credential
url: "{{instance_fqdn}}/api/eda/v1/eda-credentials/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this eda credential.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "description": "<string>",
      "inputs": {
        "in_ad": false
      },
      "organization_id": "<integer>"
    }
settings: {}
examples: ./.resources/eda credentials partial update.resources/examples
order: 3000
