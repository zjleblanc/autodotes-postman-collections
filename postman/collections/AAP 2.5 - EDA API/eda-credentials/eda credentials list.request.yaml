$kind: http-request
description: List all EDA credentials
url: "{{instance_fqdn}}/api/eda/v1/eda-credentials/?credential_type__kind=<string>&credential_type_id=<number>&name=<string>&page=<integer>&page_size=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: credential_type__kind
    value: <string>
    description: Kind of CredentialType
  - key: credential_type_id
    value: <number>
    description: Filter by Credential Type ID.
  - key: name
    value: <string>
    description: Filter by EDA credential name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
settings: {}
examples: ./.resources/eda credentials list.resources/examples
order: 2000
