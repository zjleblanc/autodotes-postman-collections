$kind: http-request
description: List all Activations
url: "{{instance_fqdn}}/api/eda/v1/activations/?decision_environment_id=<number>&name=<string>&page=<integer>&page_size=<integer>&status=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: decision_environment_id
    value: <number>
    description: Filter by Decision Environment ID.
  - key: name
    value: <string>
    description: Filter by activation name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: status
    value: <string>
    description: Filter by activation status.
settings: {}
examples: ./.resources/activations list.resources/examples
order: 2000
