$kind: http-example
request:
  url: "{{instance_fqdn}}/activations/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "decision_environment_id": "<integer>",
        "name": "<string>",
        "organization_id": "<integer>",
        "rulebook_id": "<integer>",
        "description": "<string>",
        "is_enabled": "<boolean>",
        "extra_var": "<string>",
        "restart_policy": "on-failure",
        "awx_token_id": "<integer>",
        "log_level": "debug",
        "eda_credentials": [
          "<integer>",
          "<integer>"
        ],
        "k8s_service_name": "<string>",
        "source_mappings": "<string>",
        "skip_audit_events": "<boolean>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: ""
order: 2000
