$kind: http-request
url: "{{instance_fqdn}}/api/eda/v1/activations/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "decision_environment_id": "<integer>",
      "name": "<string>",
      "organization_id": "<integer>",
      "rulebook_id": "<integer>",
      "description": "<string>",
      "is_enabled": "<boolean>",
      "extra_var": "<string>",
      "restart_policy": "on-failure",
      "awx_token_id": "<integer>",
      "log_level": "debug",
      "eda_credentials": [
        "<integer>",
        "<integer>"
      ],
      "k8s_service_name": "<string>",
      "source_mappings": "<string>",
      "skip_audit_events": "<boolean>"
    }
settings: {}
examples: ./.resources/activations create.resources/examples
order: 3000
