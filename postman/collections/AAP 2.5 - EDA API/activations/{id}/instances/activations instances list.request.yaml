$kind: http-request
description: List all instances for the Activation
url: "{{instance_fqdn}}/api/eda/v1/activations/:id/instances/?name=<string>&page=<integer>&page_size=<integer>&status=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: <string>
    description: Filter by activation instance name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: status
    value: <string>
    description: Filter by activation instance status.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this rulebook.
settings: {}
examples: ./.resources/activations instances list.resources/examples
order: 1000
