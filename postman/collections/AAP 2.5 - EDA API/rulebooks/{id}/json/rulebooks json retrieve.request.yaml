$kind: http-request
description: Get the JSON format of a rulebook by its id
url: "{{instance_fqdn}}/api/eda/v1/rulebooks/:id/json/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this rulebook.
settings: {}
examples: ./.resources/rulebooks json retrieve.resources/examples
order: 1000
