$kind: http-request
description: List all rulebooks
url: "{{instance_fqdn}}/api/eda/v1/rulebooks/?name=<string>&page=<integer>&page_size=<integer>&project_id=<number>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: <string>
    description: Filter by rulebook name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: project_id
    value: <number>
    description: Filter by rulebook's project id.
settings: {}
examples: ./.resources/rulebooks list.resources/examples
order: 2000
