$kind: http-request
description: List current user AWX tokens.
url: "{{instance_fqdn}}/api/eda/v1/users/me/awx-tokens/?page=<integer>&page_size=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: search
    value: <string>
    description: A search term.
settings: {}
examples: ./.resources/users me awx tokens list.resources/examples
order: 2000
