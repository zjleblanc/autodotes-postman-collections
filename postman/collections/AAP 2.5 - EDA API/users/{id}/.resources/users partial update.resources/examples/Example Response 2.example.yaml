$kind: http-example
request:
  url: "{{instance_fqdn}}/users/:id/"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
