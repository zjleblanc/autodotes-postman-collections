$kind: http-request
description: Partial update of a user.
url: "{{instance_fqdn}}/api/eda/v1/users/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this user.
body:
  type: json
  content: |-
    {
      "is_superuser": "<boolean>"
    }
settings: {}
examples: ./.resources/users partial update.resources/examples
order: 2000
