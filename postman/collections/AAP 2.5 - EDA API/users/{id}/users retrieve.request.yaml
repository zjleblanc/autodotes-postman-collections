$kind: http-request
description: Retrieve a user by their id
url: "{{instance_fqdn}}/api/eda/v1/users/:id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this user.
settings: {}
examples: ./.resources/users retrieve.resources/examples
order: 1000
