$kind: http-example
request:
  url: "{{instance_fqdn}}/config/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "deployment_type": "<string>",
        "time_zone": "<string>",
        "version": "<string>"
      }
order: 1000
