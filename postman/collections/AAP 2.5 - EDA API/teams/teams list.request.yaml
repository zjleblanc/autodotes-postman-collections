$kind: http-request
description: List all teams.
url: "{{instance_fqdn}}/api/eda/v1/teams/?description=<string>&name=<string>&organization_id=<number>&page=<integer>&page_size=<integer>&resource__ansible_id=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: description
    value: <string>
    description: Filter by team description.
  - key: name
    value: <string>
    description: Filter by team name.
  - key: organization_id
    value: <number>
    description: Filter by organization ID.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: resource__ansible_id
    value: <string>
    description: Filter by resource ansible ID.
settings: {}
examples: ./.resources/teams list.resources/examples
order: 2000
