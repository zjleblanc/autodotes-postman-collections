$kind: http-request
description: |-
  Role Definitions (roles) contain a list of permissions and can be used to
  assign those permissions to a user or team through the respective
  assignment endpoints.

  Custom roles can be created, modified, and deleted through this endpoint.
  System-managed roles are shown here, which cannot be edited or deleted,
  but can be assigned to users.
url: "{{instance_fqdn}}/api/eda/v1/role_definitions/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this role definition.
body:
  type: json
  content: |-
    {
      "permissions": [
        "eda.view_eventstream",
        "eda.view_rulebook"
      ],
      "content_type": "eda.edacredential",
      "name": "<string>",
      "description": "<string>"
    }
settings: {}
examples: ./.resources/role definitions partial update.resources/examples
order: 5000
