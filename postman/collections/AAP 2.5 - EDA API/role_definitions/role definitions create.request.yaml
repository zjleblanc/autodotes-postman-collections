$kind: http-request
description: Create a RoleDefinition.
url: "{{instance_fqdn}}/api/eda/v1/role_definitions/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "permissions": [
        "eda.view_rulebook",
        "shared.change_team"
      ],
      "content_type": "eda.project",
      "description": "<string>"
    }
settings: {}
examples: ./.resources/role definitions create.resources/examples
order: 3000
