$kind: http-request
description: List all teams of the organization
url: "{{instance_fqdn}}/api/eda/v1/organizations/:id/teams/?description=<string>&name=<string>&page=<integer>&page_size=<integer>&resource__ansible_id=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: description
    value: <string>
    description: Filter by team description.
  - key: name
    value: <string>
    description: Filter by team name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: resource__ansible_id
    value: <string>
    description: Filter by resource ansible ID.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this organization.
settings: {}
examples: ./.resources/organizations teams list.resources/examples
order: 1000
