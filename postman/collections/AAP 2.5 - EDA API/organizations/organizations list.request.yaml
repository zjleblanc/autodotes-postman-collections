$kind: http-request
description: List all organizations.
url: "{{instance_fqdn}}/api/eda/v1/organizations/?description=<string>&name=<string>&page=<integer>&page_size=<integer>&resource__ansible_id=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: description
    value: <string>
    description: Filter by organization description.
  - key: name
    value: <string>
    description: Filter by organization name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: resource__ansible_id
    value: <string>
    description: Filter by resource ansible ID.
settings: {}
examples: ./.resources/organizations list.resources/examples
order: 2000
