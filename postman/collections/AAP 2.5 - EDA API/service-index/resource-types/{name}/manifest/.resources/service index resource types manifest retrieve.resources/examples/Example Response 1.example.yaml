$kind: http-example
request:
  url: "{{instance_fqdn}}/service-index/resource-types/:name/manifest/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    name: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "externally_managed": "<boolean>",
        "id": "<integer>",
        "name": "<string>",
        "shared_resource_type": "<string>",
        "url": "<string>"
      }
order: 1000
