$kind: http-request
description: List all credential types
url: "{{instance_fqdn}}/api/eda/v1/credential-types/?name=<string>&namespace=<string>&page=<integer>&page_size=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: <string>
    description: Filter by credential type name.
  - key: namespace
    value: <string>
    description: Filter by credential type namespace.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
settings: {}
examples: ./.resources/credential types list.resources/examples
order: 2000
