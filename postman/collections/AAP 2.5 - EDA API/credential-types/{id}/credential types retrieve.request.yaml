$kind: http-request
description: Get credential type by id
url: "{{instance_fqdn}}/api/eda/v1/credential-types/:id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this credential type.
settings: {}
examples: ./.resources/credential types retrieve.resources/examples
order: 1000
