$kind: http-request
description: Import a project.
url: "{{instance_fqdn}}/api/eda/v1/projects/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "organization_id": "<integer>",
      "url": "<string>",
      "proxy": "<string>",
      "description": "<string>",
      "eda_credential_id": "<integer>",
      "signature_validation_credential_id": "<integer>",
      "verify_ssl": "<boolean>",
      "scm_type": "git",
      "scm_branch": "<string>",
      "scm_refspec": "<string>"
    }
settings: {}
examples: ./.resources/projects create.resources/examples
order: 3000
