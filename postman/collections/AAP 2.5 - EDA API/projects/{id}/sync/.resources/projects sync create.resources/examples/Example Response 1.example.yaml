$kind: http-example
request:
  url: "{{instance_fqdn}}/projects/:id/sync/"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "created_at": "<dateTime>",
        "created_by": "<integer>",
        "git_hash": "<string>",
        "id": "<integer>",
        "import_error": "<string>",
        "import_state": "failed",
        "modified_at": "<dateTime>",
        "modified_by": "<integer>",
        "name": "<string>",
        "organization_id": "<integer>",
        "proxy": "<string>",
        "scm_type": "git",
        "signature_validation_credential_id": "<integer>",
        "url": "<string>",
        "description": "<string>",
        "eda_credential_id": "<integer>",
        "scm_branch": "<string>",
        "scm_refspec": "<string>",
        "verify_ssl": "<boolean>"
      }
order: 1000
