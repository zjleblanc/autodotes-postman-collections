    content: |-
      {
        "name": "<string>",
        "description": "<string>",
        "organization_id": "<integer>",
        "eda_credential_id": "<integer>",
        "signature_validation_credential_id": "<integer>",
        "scm_branch": "<string>",
        "scm_refspec": "<string>",
        "verify_ssl": "<boolean>",
        "proxy": "<string>"
      }
