$kind: http-request
description: Refresh websocket access token
url: "{{instance_fqdn}}/api/eda/v1/auth/token/refresh/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "refresh": "<string>"
    }
settings: {}
examples: ./.resources/token refresh.resources/examples
order: 1000
