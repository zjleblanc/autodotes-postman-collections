$kind: http-example
request:
  url: "{{instance_fqdn}}/auth/session/login/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "password": "<string>",
        "username": "<string>"
      }
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 2000
