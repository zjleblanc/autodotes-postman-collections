$kind: http-request
description: List all the Activation Instances
url: "{{instance_fqdn}}/api/eda/v1/activation-instances/?name=<string>&page=<integer>&page_size=<integer>&status=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: <string>
    description: Filter by activation instance name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: status
    value: <string>
    description: Filter by activation instance status.
settings: {}
examples: ./.resources/activation instances list.resources/examples
order: 2000
