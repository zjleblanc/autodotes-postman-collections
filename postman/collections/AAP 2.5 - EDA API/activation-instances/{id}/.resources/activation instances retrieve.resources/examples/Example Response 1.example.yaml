$kind: http-example
request:
  url: "{{instance_fqdn}}/activation-instances/:id/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "activation_id": "<integer>",
        "ended_at": "<dateTime>",
        "id": "<integer>",
        "organization_id": "<integer>",
        "queue_name": "<string>",
        "started_at": "<dateTime>",
        "name": "<string>",
        "status": "completed",
        "git_hash": "<string>",
        "status_message": "<string>"
      }
order: 1000
