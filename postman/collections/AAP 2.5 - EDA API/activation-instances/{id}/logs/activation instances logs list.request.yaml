$kind: http-request
description: List all logs for the Activation Instance
url: "{{instance_fqdn}}/api/eda/v1/activation-instances/:id/logs/?log=<string>&page=<integer>&page_size=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: log
    value: <string>
    description: Filter by activation instance log.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this Activation Instance.
settings: {}
examples: ./.resources/activation instances logs list.resources/examples
order: 1000
