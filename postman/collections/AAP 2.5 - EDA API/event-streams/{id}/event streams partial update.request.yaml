$kind: http-request
url: "{{instance_fqdn}}/api/eda/v1/event-streams/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this event stream.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "test_mode": "<boolean>",
      "additional_data_headers": "<string>",
      "eda_credential_id": "<integer>",
      "organization_id": "<integer>"
    }
settings: {}
examples: ./.resources/event streams partial update.resources/examples
order: 3000
