$kind: http-request
description: List all eventstreams
url: "{{instance_fqdn}}/api/eda/v1/event-streams/?name=<string>&page=<integer>&page_size=<integer>&test_mode=<boolean>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: <string>
    description: Filter by event stream name.
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: test_mode
    value: <boolean>
    description: Filter by the test_mode being true or false
settings: {}
examples: ./.resources/event streams list.resources/examples
order: 2000
