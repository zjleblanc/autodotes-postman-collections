$kind: http-request
description: 'Change user password. Permissions: Each user is allowed to change their own password. A user can change the password of another user if they have ''Realm.AllocateUser'' (on the realm of user <userid>) and ''User.Modify'' permission on /access/groups/<group> on a group where user <userid> is member of. For the PAM realm, a password change does not take  effect cluster-wide, but only applies to the local node.'
url: '{{base_url}}/access/password'
method: PUT
body:
  type: json
  content: |-
    {
      "password": "",
      "userid": "",
      "confirmation-password": ""
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 13000
