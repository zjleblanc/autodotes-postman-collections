$kind: http-request
description: Register a new ACME account with CA.
url: '{{base_url}}/cluster/acme/account'
method: POST
body:
  type: json
  content: |-
    {
      "contact": "",
      "directory": "https://acme-v02.api.letsencrypt.org/directory",
      "eab-hmac-key": "",
      "eab-kid": "",
      "name": "default",
      "tos_url": ""
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 2000
