$kind: http-request
description: 'Update vzdump backup job definition. Permissions: The ''tmpdir'', ''dumpdir'' and ''script'' parameters are additionally restricted to the ''root@pam'' user.'
url: '{{base_url}}/cluster/backup/:id'
method: PUT
pathVariables:
  - key: id
    value: ''
    description: The job ID.
body:
  type: json
  content: |-
    {
      "all": false,
      "bwlimit": 0,
      "comment": "",
      "compress": "0",
      "delete": "",
      "dow": "",
      "dumpdir": "",
      "enabled": true,
      "exclude": "",
      "exclude-path": [],
      "fleecing": "",
      "ionice": 7,
      "lockwait": 180,
      "mailnotification": "always",
      "mailto": "",
      "mode": "snapshot",
      "node": "",
      "notes-template": "",
      "notification-mode": "auto",
      "pbs-change-detection-mode": "legacy",
      "performance": "",
      "pigz": 0,
      "pool": "",
      "protected": false,
      "prune-backups": "keep-all=1",
      "quiet": false,
      "remove": true,
      "repeat-missed": false,
      "schedule": "",
      "script": "",
      "starttime": "",
      "stdexcludes": true,
      "stop": false,
      "stopwait": 10,
      "storage": "",
      "tmpdir": "",
      "vmid": "",
      "zstd": 1
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 4000
