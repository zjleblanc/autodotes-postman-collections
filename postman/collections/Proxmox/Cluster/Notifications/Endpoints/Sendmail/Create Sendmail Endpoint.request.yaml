$kind: http-request
description: Create a new sendmail endpoint
url: '{{base_url}}/cluster/notifications/endpoints/sendmail'
method: POST
body:
  type: json
  content: |-
    {
      "name": "",
      "author": "",
      "comment": "",
      "disable": false,
      "from-address": "",
      "mailto": [],
      "mailto-user": []
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 2000
