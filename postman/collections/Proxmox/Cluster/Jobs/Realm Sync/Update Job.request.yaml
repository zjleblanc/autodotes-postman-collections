$kind: http-request
description: 'Update realm-sync job definition. Permissions: ''Realm.AllocateUser'' on ''/access/realm/<realm>'' and ''User.Modify'' permissions to ''/access/groups/''.'
url: '{{base_url}}/cluster/jobs/realm-sync/:id'
method: PUT
pathVariables:
  - key: id
    value: ''
    description: The ID of the job.
body:
  type: json
  content: |-
    {
      "schedule": "",
      "comment": "",
      "delete": "",
      "enable-new": true,
      "enabled": true,
      "remove-vanished": "none",
      "scope": "users"
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 4000
