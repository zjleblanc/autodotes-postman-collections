$kind: http-request
description: 'List Prefix Lists Permissions: Only returns prefix list entries where you have ''SDN.Audit'' or ''SDN.Allocate'' permissions.'
url: '{{base_url}}/cluster/sdn/prefix-lists'
method: GET
queryParams:
  - key: pending
    value: 'false'
    description: Display pending config.
    disabled: true
  - key: running
    value: 'false'
    description: Display running config.
    disabled: true
  - key: verbose
    value: 'false'
    description: If 0, only returns id - otherwise returns all properties.
    disabled: true
settings: {}
