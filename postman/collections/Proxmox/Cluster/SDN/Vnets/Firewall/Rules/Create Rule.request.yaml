$kind: http-request
description: 'Create new rule. Permissions: Needs SDN.Allocate permissions on ''/sdn/zones/<zone>/<vnet>'''
url: '{{base_url}}/cluster/sdn/vnets/:vnet/firewall/rules'
method: POST
pathVariables:
  - key: vnet
    value: ''
    description: The SDN vnet object identifier.
body:
  type: json
  content: |-
    {
      "action": "",
      "type": "in",
      "comment": "",
      "dest": "",
      "digest": "",
      "dport": "",
      "enable": 0,
      "icmp-type": "",
      "iface": "",
      "log": "emerg",
      "macro": "",
      "pos": 0,
      "proto": "",
      "source": "",
      "sport": ""
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 2000
