    {
      "advertise-subnets": false,
      "bridge": "",
      "bridge-disable-mac-learning": false,
      "controller": "",
      "delete": "",
      "dhcp": "dnsmasq",
      "digest": "",
      "disable-arp-nd-suppression": false,
      "dns": "",
      "dnszone": "",
      "dp-id": 0,
      "exitnodes": "",
      "exitnodes-local-routing": false,
      "exitnodes-primary": "",
      "fabric": "",
      "ipam": "",
      "lock-token": "",
      "mac": "",
      "mtu": 0,
      "nodes": "",
      "peers": "",
      "reversedns": "",
      "rt-import": "",
      "secondary-controllers": [],
      "tag": 0,
      "vlan-protocol": "802.1q",
      "vrf-vxlan": 0,
      "vxlan-port": 4789
