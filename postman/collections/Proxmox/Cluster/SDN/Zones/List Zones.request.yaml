$kind: http-request
description: 'SDN zones index. Permissions: Only list entries where you have ''SDN.Audit'' or ''SDN.Allocate'' permissions on ''/sdn/zones/<zone>'''
url: '{{base_url}}/cluster/sdn/zones'
method: GET
queryParams:
  - key: pending
    value: 'false'
    description: Display pending config.
    disabled: true
  - key: running
    value: 'false'
    description: Display running config.
    disabled: true
  - key: type
    value: evpn
    description: Only list SDN zones of specific type
    disabled: true
settings: {}
order: 1000
