    {
      "type": "evpn",
      "zone": "",
      "advertise-subnets": false,
      "bridge": "",
      "bridge-disable-mac-learning": false,
      "controller": "",
      "dhcp": "dnsmasq",
      "disable-arp-nd-suppression": false,
      "dns": "",
      "dnszone": "",
