$kind: http-request
description: Upload or update custom certificate chain and key.
url: '{{base_url}}/nodes/:node/certificates/custom'
method: POST
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
body:
  type: json
  content: |-
    {
      "certificates": "",
      "force": false,
      "key": "",
      "restart": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 4000
