$kind: http-request
description: Get the Ceph cluster status (raw 'ceph status' output). The response is cluster-wide and identical to /cluster/ceph/status; this node-level alias exists for operator convenience.
url: '{{base_url}}/nodes/:node/ceph/status'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
settings: {}
order: 15000
