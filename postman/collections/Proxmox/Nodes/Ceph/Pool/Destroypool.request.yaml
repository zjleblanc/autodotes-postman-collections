$kind: http-request
description: Destroy pool
url: '{{base_url}}/nodes/:node/ceph/pool/:name'
method: DELETE
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: name
    value: ''
    description: The name of the pool. It must be unique.
body:
  type: json
  content: |-
    {
      "force": false,
      "remove_ecprofile": true,
      "remove_storages": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 5000
