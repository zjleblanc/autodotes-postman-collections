$kind: http-request
description: Read storage RRD statistics.
url: '{{base_url}}/nodes/:node/storage/:storage/rrddata'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: storage
    value: ''
    description: The storage identifier.
queryParams:
  - key: timeframe
    value: hour
    description: Specify the time frame you are interested in.
    disabled: true
  - key: cf
    value: AVERAGE
    description: The RRD consolidation function
    disabled: true
settings: {}
order: 9000
