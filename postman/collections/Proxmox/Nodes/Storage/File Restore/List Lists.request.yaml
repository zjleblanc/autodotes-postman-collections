$kind: http-request
description: 'List files and directories for single file restore under the given path. Permissions: You need read access for the volume.'
url: '{{base_url}}/nodes/:node/storage/:storage/file-restore/list'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: storage
    value: ''
    description: The storage identifier.
queryParams:
  - key: filepath
    value: ''
    description: base64-path to the directory or file being listed, or "/".
    disabled: true
  - key: volume
    value: ''
    description: Backup volume ID or name. Currently only PBS snapshots are supported.
    disabled: true
settings: {}
order: 1000
