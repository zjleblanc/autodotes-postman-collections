$kind: http-request
description: 'Read task log. Permissions: The user needs ''Sys.Audit'' permissions on ''/nodes/<node>'' if they aren''t the owner of the task.'
url: '{{base_url}}/nodes/:node/tasks/:upid/log'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: upid
    value: ''
    description: The task's unique ID.
queryParams:
  - key: download
    value: 'false'
    description: Whether the tasklog file should be downloaded. This parameter can't be used in conjunction with other parameters
    disabled: true
  - key: limit
    value: '50'
    description: The number of lines to read from the tasklog.
    disabled: true
  - key: start
    value: '0'
    description: Start at this line when reading the tasklog
    disabled: true
settings: {}
order: 4000
