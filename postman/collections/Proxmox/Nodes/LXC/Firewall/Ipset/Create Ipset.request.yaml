$kind: http-request
description: Create new IPSet
url: '{{base_url}}/nodes/:node/lxc/:vmid/firewall/ipset'
method: POST
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
body:
  type: json
  content: |-
    {
      "name": "",
      "comment": "",
      "digest": "",
      "rename": ""
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 2000
