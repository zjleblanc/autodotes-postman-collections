$kind: http-request
description: Update IP or Network settings
url: '{{base_url}}/nodes/:node/lxc/:vmid/firewall/ipset/:name/:cidr'
method: PUT
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
  - key: name
    value: ''
    description: IP set name.
  - key: cidr
    value: ''
    description: Network/IP specification in CIDR format.
body:
  type: json
  content: |-
    {
      "comment": "",
      "digest": "",
      "nomatch": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 7000
