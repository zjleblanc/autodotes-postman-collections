$kind: http-request
description: List IPSet content
url: '{{base_url}}/nodes/:node/lxc/:vmid/firewall/ipset/:name'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
