$kind: http-request
description: Check if feature for virtual machine is available.
url: '{{base_url}}/nodes/:node/lxc/:vmid/feature'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
queryParams:
  - key: feature
    value: snapshot
    description: Feature to check.
    disabled: true
  - key: snapname
    value: ''
    description: The name of the snapshot.
    disabled: true
settings: {}
order: 19000
