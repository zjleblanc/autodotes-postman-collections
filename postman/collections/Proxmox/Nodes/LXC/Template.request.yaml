$kind: http-request
description: 'Create a Template. Permissions: You need ''VM.Allocate'' permissions on /vms/{vmid}'
url: '{{base_url}}/nodes/:node/lxc/:vmid/template'
method: POST
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
settings: {}
order: 20000
