$kind: http-request
description: 'Read replication job log. Permissions: Requires the VM.Audit permission on /vms/<vmid>, or ''Sys.Audit'' on ''/nodes/<node>'''
url: '{{base_url}}/nodes/:node/replication/:id/log'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: id
    value: ''
    description: 'Replication Job ID. The ID is composed of a Guest ID and a job number, separated by a hyphen, i.e. ''<GUEST>-<JOBNUM>''.'
queryParams:
  - key: limit
    value: '0'
    disabled: true
  - key: start
    value: '0'
    disabled: true
settings: {}
order: 4000
