$kind: http-request
description: 'Schedule replication job to start as soon as possible. Permissions: Requires the VM.Replicate permission on /vms/<vmid>.'
url: '{{base_url}}/nodes/:node/replication/:id/schedule_now'
method: POST
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: id
    value: ''
    description: 'Replication Job ID. The ID is composed of a Guest ID and a job number, separated by a hyphen, i.e. ''<GUEST>-<JOBNUM>''.'
settings: {}
order: 5000
