$kind: http-request
description: Delete IPSet
url: '{{base_url}}/nodes/:node/qemu/:vmid/firewall/ipset/:name'
method: DELETE
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
  - key: name
    value: ''
    description: IP set name.
body:
  type: json
  content: |-
    {
      "force": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 5000
