$kind: http-request
description: Update IP or Network alias.
url: '{{base_url}}/nodes/:node/qemu/:vmid/firewall/aliases/:name'
method: PUT
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
  - key: name
    value: ''
    description: Alias name.
body:
  type: json
  content: |-
    {
      "cidr": "",
      "comment": "",
      "digest": "",
      "rename": ""
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 4000
