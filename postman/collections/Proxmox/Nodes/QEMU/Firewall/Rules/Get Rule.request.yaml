$kind: http-request
description: Get single rule data.
url: '{{base_url}}/nodes/:node/qemu/:vmid/firewall/rules/:pos'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
  - key: pos
    value: '0'
    description: 'Update rule at position <pos>.'
settings: {}
order: 3000
