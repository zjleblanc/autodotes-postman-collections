$kind: http-request
description: Get VM firewall options.
url: '{{base_url}}/nodes/:node/qemu/:vmid/firewall/options'
method: GET
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
settings: {}
order: 5000
