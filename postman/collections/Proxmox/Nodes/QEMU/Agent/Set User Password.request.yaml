$kind: http-request
description: Sets the password for the given user to the given password
url: '{{base_url}}/nodes/:node/qemu/:vmid/agent/set-user-password'
method: POST
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
body:
  type: json
  content: |-
    {
      "password": "",
      "username": "",
      "crypted": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 23000
