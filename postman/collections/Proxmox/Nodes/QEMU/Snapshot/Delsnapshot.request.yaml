$kind: http-request
description: Delete a VM snapshot.
url: '{{base_url}}/nodes/:node/qemu/:vmid/snapshot/:snapname'
method: DELETE
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
  - key: snapname
    value: ''
    description: The name of the snapshot.
body:
  type: json
  content: |-
    {
      "force": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 4000
