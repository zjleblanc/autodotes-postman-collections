$kind: http-request
description: Snapshot a VM.
url: '{{base_url}}/nodes/:node/qemu/:vmid/snapshot'
method: POST
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
body:
  type: json
  content: |-
    {
      "snapname": "",
      "description": "",
      "vmstate": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 2000
