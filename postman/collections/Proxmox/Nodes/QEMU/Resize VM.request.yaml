$kind: http-request
description: Extend volume size.
url: '{{base_url}}/nodes/:node/qemu/:vmid/resize'
method: PUT
pathVariables:
  - key: node
    value: ''
    description: The cluster node name.
  - key: vmid
    value: '0'
    description: The (unique) ID of the VM.
body:
  type: json
  content: |-
    {
      "disk": "ide0",
      "size": "",
      "digest": "",
      "skiplock": false
    }
headers:
  - key: Content-Type
    value: application/json
settings: {}
order: 28000
