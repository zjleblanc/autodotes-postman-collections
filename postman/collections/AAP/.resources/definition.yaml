$kind: collection
description: Ansible Automation Platform (ansible.autodotes.com). One folder per federated top-level API discovered at /api/ (gateway, controller, eda, galaxy, lightspeed, metrics). Auth and base URL are scoped here so every nested request inherits them.
variables:
  - key: aap_base_url
    value: https://ansible.autodotes.com
    disabled: false
  - key: aap_token
    secret: true
    disabled: false
auth:
  type: bearer
  credentials:
    token: "{{aap_token}}"
