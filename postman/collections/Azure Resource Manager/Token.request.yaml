$kind: http-request
url: https://login.microsoftonline.com/{{tenant_id}}/oauth2/v2.0/token
method: POST
body:
  type: urlencoded
  content:
    grant_type: client_credentials
    client_id: "{{client_id}}"
    client_secret: "{{client_secret}}"
    scope: https://management.azure.com/.default
settings: {}
order: 2000
