$kind: http-example
request:
  url: "{{baseUrl}}/v2/sftp/token/"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "expiryInDays": 60,
        "isAnonymous": true,
        "isOneTime": true
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "internalErrorCode": "string",
        "message": "string",
        "detailMessage": "string",
        "recommendations": [
          "string",
          "string"
        ]
      }
order: 3000
