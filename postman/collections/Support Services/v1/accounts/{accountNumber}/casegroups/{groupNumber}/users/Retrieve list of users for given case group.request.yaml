$kind: http-request
description: Retrieve the users on the account and group specified in the path.
url: "{{baseUrl}}/v1/accounts/:accountNumber/casegroups/:groupNumber/users"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: accountNumber
    value: string
    description: (Required) Account Number
  - key: groupNumber
    value: string
    description: (Required) Group Number
auth:
  type: noauth
settings: {}
examples: ./.resources/Retrieve list of users for given case group.resources/examples
order: 1000
