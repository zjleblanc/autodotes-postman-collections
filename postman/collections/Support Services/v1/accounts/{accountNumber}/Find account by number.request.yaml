$kind: http-request
description: Returns the account specified in the path.
url: "{{baseUrl}}/v1/accounts/:accountNumber"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: accountNumber
    value: string
    description: (Required) account number
auth:
  type: noauth
settings: {}
examples: ./.resources/Find account by number.resources/examples
order: 3000
