$kind: http-request
description: Retrieve the partner accounts  for the account specified in the path.
url: "{{baseUrl}}/v1/accounts/partner/:customerAccountNumber"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: customerAccountNumber
    value: string
    description: (Required) Customer Account Number
auth:
  type: noauth
settings: {}
examples: ./.resources/List Partner Accounts for Customer.resources/examples
order: 1000
