$kind: http-request
url: "{{baseUrl}}/v1/sftp/attachments/?path=string&includeAll=false"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: path
    value: string
    description: Absolute Path for which you want to list files
  - key: includeAll
    value: "false"
    description: Recursively lists all files if true. Allowed only for internal users
auth:
  type: noauth
settings: {}
examples: ./.resources/List Sftp Attachments.resources/examples
order: 2000
