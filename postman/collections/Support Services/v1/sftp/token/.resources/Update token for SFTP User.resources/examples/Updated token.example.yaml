$kind: http-example
request:
  url: "{{baseUrl}}/v1/sftp/token/"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "expiryInDays": 60,
        "isAnonymous": true,
        "isOneTime": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "string",
        "token": "string",
        "expiryDate": "string"
      }
order: 1000
