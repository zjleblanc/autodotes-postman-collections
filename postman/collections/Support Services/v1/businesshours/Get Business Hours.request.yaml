$kind: http-request
description: Retrieves the list of business hours based on specified timezone.
url: "{{baseUrl}}/v1/businesshours?timezone=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: timezone
    value: string
    description: (Required) Timezone
auth:
  type: noauth
settings: {}
examples: ./.resources/Get Business Hours.resources/examples
order: 1000
