$kind: http-request
description: Add a comment to the case specified in the path with the content of the request.
url: "{{baseUrl}}/v1/cases/:caseNumber/comments"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: caseNumber
    value: string
    description: (Required) caseNumber
body:
  type: json
  content: |-
    {
      "id": "string",
      "caseNumber": "string",
      "commentBody": "string",
      "createdDate": "1987-09-06T08:36:55.784Z",
      "createdByType": "string",
      "isDraft": false,
      "lastModifiedById": "string",
      "lastModifiedDate": "1946-02-03T02:52:24.720Z",
      "publishedDate": "2021-04-05T01:19:04.717Z",
      "createdBy": "string",
      "contentType": "string",
      "doNotChangeStatus": false
    }
auth:
  type: noauth
settings: {}
examples: ./.resources/Create Comment on case.resources/examples
order: 3000
