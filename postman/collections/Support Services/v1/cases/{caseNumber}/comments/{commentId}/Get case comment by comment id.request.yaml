$kind: http-request
description: Retrieve the content specified by the case number and comment id in the path.
url: "{{baseUrl}}/v1/cases/:caseNumber/comments/:commentId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: caseNumber
    value: string
    description: (Required) Case Number
  - key: commentId
    value: string
    description: (Required) Comment Id
auth:
  type: noauth
settings: {}
examples: ./.resources/Get case comment by comment id.resources/examples
order: 1000
