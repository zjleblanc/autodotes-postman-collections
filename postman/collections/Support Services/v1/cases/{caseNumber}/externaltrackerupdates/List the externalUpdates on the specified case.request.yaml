$kind: http-request
description: Retrieve the externalUpdates on the case number specified in the path.
url: "{{baseUrl}}/v1/cases/:caseNumber/externaltrackerupdates?startDate=string&endDate=string&sortField=string&sortOrder=string&originatingSystem=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: string
    description: Start Date
  - key: endDate
    value: string
    description: End Date
  - key: sortField
    value: string
    description: Sort Field
  - key: sortOrder
    value: string
    description: Sort Order
  - key: originatingSystem
    value: string
    description: Originating system
pathVariables:
  - key: caseNumber
    value: string
    description: (Required) Case Number
auth:
  type: noauth
settings: {}
examples: ./.resources/List the externalUpdates on the specified case.resources/examples
order: 1000
