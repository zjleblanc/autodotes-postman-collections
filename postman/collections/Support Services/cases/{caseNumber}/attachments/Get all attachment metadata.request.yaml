$kind: http-request
url: "{{baseUrl}}/cases/:caseNumber/attachments/?includeDeleted=string&sortingField=string&sortBy=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: includeDeleted
    value: string
    description: flag to include deleted attachments in the response
  - key: sortingField
    value: string
    description: Sorting Field Name like id, lastModifiedDate,createDate,sizeKB except size
  - key: sortBy
    value: string
    description: Sort by desc/asc
pathVariables:
  - key: caseNumber
    value: string
    description: "(Required) "
auth:
  type: noauth
settings: {}
examples: ./.resources/Get all attachment metadata.resources/examples
order: 3000
