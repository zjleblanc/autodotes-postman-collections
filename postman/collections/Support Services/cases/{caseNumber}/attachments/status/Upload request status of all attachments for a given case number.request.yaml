$kind: http-request
url: "{{baseUrl}}/cases/:caseNumber/attachments/status"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: caseNumber
    value: string
    description: "(Required) "
auth:
  type: noauth
settings: {}
examples: ./.resources/Upload request status of all attachments for a given case number.resources/examples
order: 1000
