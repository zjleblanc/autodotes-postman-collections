$kind: http-example
request:
  url: "{{baseUrl}}/search/recommendations"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "summary": "string",
        "description": "string",
        "product": "string",
        "version": "string"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "internalErrorCode": "string",
        "message": "string",
        "detailMessage": "string",
        "recommendations": [
          "string",
          "string"
        ]
      }
order: 2000
