$kind: http-request
description: Retrieves the list of recommendations from Solr based on the input request
url: "{{baseUrl}}/search/recommendations?q=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: q
    value: string
    description: (Required) Input query
auth:
  type: noauth
settings: {}
examples: ./.resources/Fetches Recommendation based on Search Criteria.resources/examples
order: 1000
