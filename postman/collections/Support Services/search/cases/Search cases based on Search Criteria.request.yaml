$kind: http-request
description: Retrieves the list of cases from Solr based on the input request
url: "{{baseUrl}}/search/cases?q=string&partnerSearch=true"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: q
    value: string
    description: (Required) Solr query
  - key: partnerSearch
    value: "true"
    description: If you want to include partners accounts as well
auth:
  type: noauth
settings: {}
examples: ./.resources/Search cases based on Search Criteria.resources/examples
order: 1000
