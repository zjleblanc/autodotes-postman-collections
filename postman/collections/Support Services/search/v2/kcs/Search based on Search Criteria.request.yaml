$kind: http-request
description: Retrieves the list of documents from Solr based on the input request
url: "{{baseUrl}}/search/v2/kcs"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "q": "string",
      "expression": "string",
      "start": 9404,
      "rows": 4686,
      "clientName": "string"
    }
settings: {}
examples: ./.resources/Search based on Search Criteria.resources/examples
order: 1000
