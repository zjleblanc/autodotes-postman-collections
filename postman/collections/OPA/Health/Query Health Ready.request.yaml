$kind: http-request
description: >-
  Policy-based readiness check evaluating data.system.health.ready. Requires a
  policy under package system.health; returns 500 until that rule evaluates to
  true (or is missing/undefined).

  Status codes: 200 healthy; 500 unhealthy.
url: '{{base_url}}/health/ready'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Query Health Ready.resources/examples'
order: 3000
