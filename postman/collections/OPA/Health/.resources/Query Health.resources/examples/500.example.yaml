$kind: http-example
name: '500 Unhealthy Bundles'
request:
  url: '{{base_url}}/health'
  method: GET
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "one or more bundles are not activated: authz, data"
      }
order: 2000
