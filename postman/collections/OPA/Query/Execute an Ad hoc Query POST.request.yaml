$kind: http-request
name: 'Execute an Ad hoc Query (POST)'
description: >-
  Execute an ad hoc Rego query with the query (and optional input) in the JSON
  body. Preferred for large JSON values.

  Status codes: 200 no error; 400 bad request; 500 server error; 501 streaming
  not implemented.
url: '{{base_url}}/v1/query'
method: POST
headers:
  - key: Content-Type
    value: application/json
queryParams:
  - key: pretty
    value: 'true'
    description: 'If true, response is formatted for humans.'
    disabled: true
  - key: explain
    value: notes
    description: 'Return query explanation. Values: notes, fails, full, debug.'
    disabled: true
  - key: metrics
    value: 'true'
    description: 'Return query performance metrics in addition to result.'
    disabled: true
  - key: rule_labels
    value: 'true'
    description: 'If true, response includes merged METADATA labels of evaluated rules.'
    disabled: true
body:
  type: json
  content: |-
    {
      "query": "input.servers[i].ports[_] = \"p2\"; input.servers[i].name = name",
      "input": {
        "servers": [
          {
            "name": "app",
            "ports": ["p1", "p2", "p3"]
          },
          {
            "name": "db",
            "ports": ["p3"]
          },
          {
            "name": "cache",
            "ports": ["p1"]
          },
          {
            "name": "dev",
            "ports": ["p1", "p2"]
          }
        ]
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
examples: './.resources/Execute an Ad hoc Query POST.resources/examples'
order: 3000
