$kind: http-request
description: Get a single policy, if it belongs to this project or is a global project-scoped policy.
url: '{{base_url}}/api/v1/projects/:project_id/policies/:policy_id'
method: GET
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
  - key: policy_id
    value: '{{policy_id}}'
    description: '(Required) UUID of the policy'
settings: {}
order: 3000
