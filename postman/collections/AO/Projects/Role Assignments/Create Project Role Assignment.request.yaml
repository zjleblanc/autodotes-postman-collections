$kind: http-request
description: Assign a role to a user or group within a project.
url: '{{base_url}}/api/v1/projects/:project_id/role_assignments'
method: POST
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
body:
  type: json
  content: |-
    {
      "principal_id": "{{user_id}}",
      "role_name": "project-user"
    }
settings: {}
order: 1000
