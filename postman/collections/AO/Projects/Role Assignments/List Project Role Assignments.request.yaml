$kind: http-request
description: >-
  List role assignments for a project with policy-driven visibility.
  Users with role-assignment:read:self see only their own assignments.
url: '{{base_url}}/api/v1/projects/:project_id/role_assignments'
method: GET
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
queryParams:
  - key: limit
    value: '20'
    disabled: true
  - key: cursor
    value: ''
    disabled: true
  - key: sort
    value: ''
    disabled: true
settings: {}
order: 2000
