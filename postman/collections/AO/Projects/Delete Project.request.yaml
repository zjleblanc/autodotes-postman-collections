$kind: http-request
description: Delete a project (hard-delete). Requires project:delete permission scoped to this project.
url: '{{base_url}}/api/v1/projects/:project_id'
method: DELETE
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
settings: {}
order: 6000
