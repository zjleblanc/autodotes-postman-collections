$kind: http-request
description: Create a new credential in this project. Requires credential:create permission.
url: '{{base_url}}/api/v1/projects/:project_id/credentials'
method: POST
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
body:
  type: json
  content: |-
    {
      "name": "My API Key",
      "description": "Third-party API credential",
      "credential_type_id": "{{credential_type_id}}",
      "inputs": {
        "api_key": "changeme"
      },
      "labels": {}
    }
settings: {}
order: 1000
