$kind: http-request
description: Get a credential in this project. Secret fields are masked as $encrypted$.
url: '{{base_url}}/api/v1/projects/:project_id/credentials/:credential_id'
method: GET
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
  - key: credential_id
    value: '{{credential_id}}'
    description: '(Required) UUID of the credential'
settings: {}
order: 3000
