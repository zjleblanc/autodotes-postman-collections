$kind: http-request
description: Update a credential in this project. Requires credential:update permission.
url: '{{base_url}}/api/v1/projects/:project_id/credentials/:credential_id'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
  - key: credential_id
    value: '{{credential_id}}'
    description: '(Required) UUID of the credential'
body:
  type: json
  content: |-
    {
      "description": "Updated description"
    }
settings: {}
order: 4000
