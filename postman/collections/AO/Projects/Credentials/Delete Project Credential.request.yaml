$kind: http-request
description: Delete a credential in this project. Requires credential:delete permission.
url: '{{base_url}}/api/v1/projects/:project_id/credentials/:credential_id'
method: DELETE
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
  - key: credential_id
    value: '{{credential_id}}'
    description: '(Required) UUID of the credential'
settings: {}
order: 5000
