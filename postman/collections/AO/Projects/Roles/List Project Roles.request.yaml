$kind: http-request
description: List roles visible within this project (project-owned + global project-scope roles).
url: '{{base_url}}/api/v1/projects/:project_id/roles'
method: GET
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
queryParams:
  - key: limit
    value: '20'
    disabled: true
  - key: cursor
    value: ''
    disabled: true
  - key: sort
    value: ''
    disabled: true
settings: {}
order: 2000
