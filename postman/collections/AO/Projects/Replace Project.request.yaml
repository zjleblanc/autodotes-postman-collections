$kind: http-request
description: Replace a project. Requires project:update permission scoped to this project.
url: '{{base_url}}/api/v1/projects/:project_id'
method: PUT
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
body:
  type: json
  content: |-
    {
      "name": "My Project",
      "description": "Project description",
      "labels": {}
    }
settings: {}
order: 5000
