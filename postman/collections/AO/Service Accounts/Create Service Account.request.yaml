$kind: http-request
description: Create a new service account.
url: '{{base_url}}/api/v1/service_accounts'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "ci-pipeline",
      "project_id": "{{project_id}}",
      "description": "Service account for CI pipeline"
    }
settings: {}
order: 1000
