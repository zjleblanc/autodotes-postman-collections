$kind: http-request
description: Update a service account's name and/or description.
url: '{{base_url}}/api/v1/service_accounts/:service_account_id'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: service_account_id
    value: '{{service_account_id}}'
    description: '(Required) UUID of the service account'
body:
  type: json
  content: |-
    {
      "description": "Updated description"
    }
settings: {}
order: 4000
