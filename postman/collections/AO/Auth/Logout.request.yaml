$kind: http-request
description: >-
  Terminate the current session by revoking the refresh token (read from
  the ao_refresh_token cookie). Clears the refresh and CSRF cookies.
url: '{{base_url}}/api/v1/auth/logout'
method: POST
headers:
  - key: X-CSRF-Token
    value: '{{csrf_token}}'
auth:
  type: noauth
queryParams:
  - key: post_logout_redirect_uri
    value: string
    disabled: true
    description: Optional post-logout redirect URL, validated against CORS origins
settings: {}
order: 6000
