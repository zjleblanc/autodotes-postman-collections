$kind: http-request
description: Create a new identity provider.
url: '{{base_url}}/api/v1/identity_providers'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Corporate OIDC",
      "enabled": true,
      "configuration": {
        "provider_type": "oidc",
        "issuer_url": "https://idp.example.com",
        "client_id": "syntara-client",
        "client_secret": "changeme",
        "redirect_uri": "{{base_url}}/api/v1/auth/oidc/callback",
        "auto_discovery": true,
        "scopes": ["openid", "profile", "email"]
      }
    }
settings: {}
order: 2000
