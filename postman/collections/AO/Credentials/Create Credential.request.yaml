$kind: http-request
description: Create a new credential with encrypted inputs.
url: '{{base_url}}/api/v1/credentials'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "My API Key",
      "description": "Third-party API credential",
      "credential_type_id": "{{credential_type_id}}",
      "project_id": "{{project_id}}",
      "inputs": {
        "api_key": "changeme"
      },
      "labels": {}
    }
settings: {}
order: 1000
