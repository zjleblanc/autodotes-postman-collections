$kind: http-request
description: Update a credential. Fields left as $encrypted$ retain their existing values.
url: '{{base_url}}/api/v1/credentials/:credential_id'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: credential_id
    value: '{{credential_id}}'
    description: '(Required) UUID of the credential'
body:
  type: json
  content: |-
    {
      "description": "Updated description"
    }
settings: {}
order: 4000
