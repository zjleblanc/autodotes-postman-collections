$kind: http-request
description: >-
  Get workflows that reference this credential (workflows with nodes whose
  executor config includes this credential_id).
url: '{{base_url}}/api/v1/credentials/:credential_id/workflows'
method: GET
pathVariables:
  - key: credential_id
    value: '{{credential_id}}'
    description: '(Required) UUID of the credential'
settings: {}
order: 6000
