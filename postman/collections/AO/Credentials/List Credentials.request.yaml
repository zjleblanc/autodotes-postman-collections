$kind: http-request
description: >-
  List credentials with filtering and pagination (metadata only, no secrets).
  Pass for_action=use to return only credentials the user has credential:use
  permission on.
url: '{{base_url}}/api/v1/credentials'
method: GET
queryParams:
  - key: limit
    value: '20'
    disabled: true
  - key: cursor
    value: ''
    disabled: true
  - key: sort
    value: ''
    disabled: true
  - key: for_action
    value: ''
    disabled: true
    description: Set to "use" to filter by credential:use permission
settings: {}
order: 2000
