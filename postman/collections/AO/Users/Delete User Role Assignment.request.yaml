$kind: http-request
description: Remove a role assignment from this user.
url: '{{base_url}}/api/v1/users/:user_id/role_assignments/:assignment_id'
method: DELETE
pathVariables:
  - key: user_id
    value: '{{user_id}}'
    description: '(Required) UUID of the user'
  - key: assignment_id
    value: '{{assignment_id}}'
    description: '(Required) UUID of the role assignment'
settings: {}
order: 11000
