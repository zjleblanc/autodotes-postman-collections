$kind: http-request
description: Assign a role to this user, optionally scoped to a project.
url: '{{base_url}}/api/v1/users/:user_id/role_assignments'
method: POST
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: user_id
    value: '{{user_id}}'
    description: '(Required) UUID of the user'
body:
  type: json
  content: |-
    {
      "role_name": "project-user",
      "project_id": "{{project_id}}"
    }
settings: {}
order: 9000
