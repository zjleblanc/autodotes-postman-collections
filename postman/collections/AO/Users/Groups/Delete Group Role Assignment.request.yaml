$kind: http-request
description: Remove a role assignment from this group.
url: '{{base_url}}/api/v1/groups/:group_id/role_assignments/:assignment_id'
method: DELETE
pathVariables:
  - key: group_id
    value: '{{group_id}}'
    description: '(Required) UUID of the group'
  - key: assignment_id
    value: '{{assignment_id}}'
    description: '(Required) UUID of the role assignment'
settings: {}
order: 11000
