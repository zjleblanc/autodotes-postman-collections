$kind: http-request
description: Add a user to a group.
url: '{{base_url}}/api/v1/groups/:group_id/members'
method: POST
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: group_id
    value: '{{group_id}}'
    description: '(Required) UUID of the group'
body:
  type: json
  content: |-
    {
      "user_id": "{{user_id}}"
    }
settings: {}
order: 6000
