$kind: http-request
description: Replace a role. Builtin roles cannot be modified. Requires role:update permission.
url: '{{base_url}}/api/v1/roles/:role_id'
method: PUT
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: role_id
    value: '{{role_id}}'
    description: '(Required) UUID of the role'
body:
  type: json
  content: |-
    {
      "name": "auditor-plus",
      "description": "Extended auditor role",
      "policies": [],
      "labels": {}
    }
settings: {}
order: 5000
