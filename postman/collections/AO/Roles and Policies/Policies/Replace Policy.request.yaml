$kind: http-request
description: Replace a policy. Builtin policies cannot be modified. Requires policy:update permission.
url: '{{base_url}}/api/v1/policies/:policy_id'
method: PUT
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: policy_id
    value: '{{policy_id}}'
    description: '(Required) UUID of the policy'
body:
  type: json
  content: |-
    {
      "name": "global-read-only",
      "description": "Read-only access to all projects",
      "statements": [
        {
          "effect": "allow",
          "resource": "project",
          "actions": ["read"]
        }
      ],
      "labels": {}
    }
settings: {}
order: 5000
