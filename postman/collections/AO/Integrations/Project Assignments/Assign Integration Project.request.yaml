$kind: http-request
description: Assign a project to a project-scoped integration.
url: '{{base_url}}/api/v1/integrations/:integration_id/projects/:project_id'
method: POST
pathVariables:
  - key: integration_id
    value: '{{integration_id}}'
    description: '(Required) UUID of the integration'
  - key: project_id
    value: '{{project_id}}'
    description: '(Required) UUID of the project'
settings: {}
order: 1000
