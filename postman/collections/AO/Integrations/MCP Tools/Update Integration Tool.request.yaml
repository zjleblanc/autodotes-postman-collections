$kind: http-request
description: Update (enable/disable) a tool, scoped to an integration.
url: '{{base_url}}/api/v1/integrations/:integration_id/tools/:tool_id'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: integration_id
    value: '{{integration_id}}'
    description: '(Required) UUID of the integration'
  - key: tool_id
    value: '{{tool_id}}'
    description: '(Required) UUID of the tool'
body:
  type: json
  content: |-
    {
      "enabled": false
    }
settings: {}
order: 3000
