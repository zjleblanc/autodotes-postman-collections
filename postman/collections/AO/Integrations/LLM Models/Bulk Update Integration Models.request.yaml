$kind: http-request
description: Bulk enable/disable LLM models for an integration.
url: '{{base_url}}/api/v1/integrations/:integration_id/models/bulk_update'
method: PATCH
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: integration_id
    value: '{{integration_id}}'
    description: '(Required) UUID of the integration'
body:
  type: json
  content: |-
    {
      "model_ids": [],
      "enabled": true
    }
settings: {}
order: 4000
