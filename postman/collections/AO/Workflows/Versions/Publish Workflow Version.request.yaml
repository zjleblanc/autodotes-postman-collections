$kind: http-request
description: Publish a specific workflow version, making it the active published version.
url: '{{base_url}}/api/v1/workflows/:workflow_id/versions/:version/publish'
method: POST
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: workflow_id
    value: '{{workflow_id}}'
    description: '(Required) UUID of the workflow'
  - key: version
    value: '1'
    description: '(Required) Integer version number'
body:
  type: json
  content: |-
    {
      "change_description": "Publishing version 1"
    }
settings: {}
order: 4000
