$kind: http-request
description: >-
  List workflows the current user has read access to. Supports filtering by
  created_by, is_enabled, and labels[key]=value, with cursor-based pagination.
url: '{{base_url}}/api/v1/workflows'
method: GET
queryParams:
  - key: limit
    value: '20'
    disabled: true
  - key: cursor
    value: ''
    disabled: true
  - key: sort
    value: ''
    disabled: true
settings: {}
order: 3000
