$kind: http-example
request:
  url: "{{instance_fqdn}}/api/gateway/v1/legacy_auth/hub_password/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: gateway_sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "password": "<string>",
        "username": "<string>"
      }
order: 1000
