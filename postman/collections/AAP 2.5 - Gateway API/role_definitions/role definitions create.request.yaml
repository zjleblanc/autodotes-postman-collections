$kind: http-request
description: |-
  Role Definitions (roles) contain a list of permissions and can be used to
  assign those permissions to a user or team through the respective
  assignment endpoints.

  Custom roles can be created, modified, and deleted through this endpoint.
  System-managed roles are shown here, which cannot be edited or deleted,
  but can be assigned to users.
url: "{{instance_fqdn}}/api/gateway/v1/role_definitions/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "permissions": [
        "shared.delete_team",
        "shared.delete_organization"
      ],
      "content_type": "shared.team",
      "description": "<string>",
      "created": -46898769.520568706,
      "created_by": -84097693,
      "id": -59396650,
      "managed": -62826170,
      "modified": false,
      "modified_by": -62838783.78337704,
      "related": "fugiat irure pariatur sint"
    }
settings: {}
examples: ./.resources/role definitions create.resources/examples
order: 3000
