$kind: http-request
description: |-
  Role Definitions (roles) contain a list of permissions and can be used to
  assign those permissions to a user or team through the respective
  assignment endpoints.

  Custom roles can be created, modified, and deleted through this endpoint.
  System-managed roles are shown here, which cannot be edited or deleted,
  but can be assigned to users.
url: "{{instance_fqdn}}/api/gateway/v1/role_definitions/:id/"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this role definition.
body:
  type: json
  content: |-
    {
      "content_type": "shared.team",
      "name": "<string>",
      "permissions": [
        "shared.member_team",
        "shared.view_organization"
      ],
      "description": "<string>",
      "created": "quis",
      "created_by": false,
      "id": 76141531,
      "managed": 81095772.48289835,
      "modified": "dolor enim",
      "modified_by": "id sit eiusmod sunt ut",
      "related": -18167123.066333085,
      "summary_fields": false
    }
settings: {}
examples: ./.resources/role definitions update.resources/examples
order: 4000
