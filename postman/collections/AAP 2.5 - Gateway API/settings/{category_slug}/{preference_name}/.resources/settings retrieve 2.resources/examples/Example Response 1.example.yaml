$kind: http-example
request:
  url: "{{instance_fqdn}}/api/gateway/v1/settings/:category_slug/:preference_name/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: gateway_sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    category_slug: ""
    preference_name: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "value": "<string>",
        "section": "<string>"
      }
order: 1000
