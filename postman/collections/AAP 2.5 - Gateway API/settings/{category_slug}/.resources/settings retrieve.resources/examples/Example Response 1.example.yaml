$kind: http-example
request:
  url: "{{instance_fqdn}}/api/gateway/v1/settings/:category_slug/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: gateway_sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    category_slug: ""
