$kind: http-example
request:
  url: "{{instance_fqdn}}/api/gateway/v1/settings/?page=<integer>&page_size=<integer>"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: gateway_sessionid
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: page
      value: <integer>
      description: A page number within the paginated result set.
    - key: page_size
      value: <integer>
      description: Number of results to return per page.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "count": "<integer>",
        "results": [
          {
            "name": "<string>",
            "url": "<string>"
          },
          {
            "name": "<string>",
            "url": "<string>"
          }
        ],
        "next": "<uri>",
        "previous": "<uri>"
      }
order: 1000
