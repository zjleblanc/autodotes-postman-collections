$kind: http-request
description: Index of all the resources in the system.
url: "{{instance_fqdn}}/api/gateway/v1/service-index/resources/:ansible_id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: ansible_id
    value: <uuid>
    description: "(Required) "
settings: {}
examples: ./.resources/service index resources retrieve.resources/examples
order: 1000
