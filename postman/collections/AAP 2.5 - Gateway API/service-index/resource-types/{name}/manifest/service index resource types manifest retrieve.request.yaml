$kind: http-request
description: Returns the as a stream the csv of resource_id,hash for a given resource type.
url: "{{instance_fqdn}}/api/gateway/v1/service-index/resource-types/:name/manifest/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: name
    value: ",a?|%AwOa"
    description: "(Required) "
settings: {}
examples: ./.resources/service index resource types manifest retrieve.resources/examples
order: 1000
