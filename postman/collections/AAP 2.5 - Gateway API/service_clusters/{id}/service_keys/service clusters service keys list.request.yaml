$kind: http-request
description: |-
  Manage Service Key objects in the 'service_keys' relationship of this particular Service Cluster.

  Starting from the detail URL:

  GET /:id/service_keys/ to show service keys currently in the relationship
url: "{{instance_fqdn}}/api/gateway/v1/service_clusters/:id/service_keys/?page=<integer>&page_size=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: search
    value: <string>
    description: A search term.
pathVariables:
  - key: id
    value: "1714231316"
    description: "(Required) "
settings: {}
examples: ./.resources/service clusters service keys list.resources/examples
order: 1000
