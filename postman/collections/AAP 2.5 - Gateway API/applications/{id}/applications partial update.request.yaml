$kind: http-request
url: "{{instance_fqdn}}/api/gateway/v1/applications/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this application.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "redirect_uris": "<string>",
      "post_logout_redirect_uris": "<string>",
      "algorithm": "HS256",
      "user": "<integer>",
      "description": "<string>",
      "organization": "<integer>",
      "client_type": "public",
      "skip_authorization": "<boolean>",
      "authorization_grant_type": "password"
    }
settings: {}
examples: ./.resources/applications partial update.resources/examples
order: 4000
