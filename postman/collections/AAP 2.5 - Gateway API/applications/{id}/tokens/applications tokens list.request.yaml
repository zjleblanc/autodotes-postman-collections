$kind: http-request
description: |-
  Manage Access Token objects in the 'access_tokens' relationship of this particular Application.

  Starting from the detail URL:

  GET /:id/access_tokens/ to show access tokens currently in the relationship
url: "{{instance_fqdn}}/api/gateway/v1/applications/:id/tokens/?page=<integer>&page_size=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: search
    value: <string>
    description: A search term.
pathVariables:
  - key: id
    value: "1714231316"
    description: "(Required) "
settings: {}
examples: ./.resources/applications tokens list.resources/examples
order: 1000
