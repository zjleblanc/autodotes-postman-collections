$kind: http-request
description: |-
  Manage Additional Route objects in the 'routes' relationship of this particular Http Port.

  Starting from the detail URL:

  GET /:id/routes/ to show additional routes currently in the relationship

  POST a list of instances to /:id/routes/associate/ to add those additional routes to the relationship

  POST a list of instances to /:id/routes/disassociate/ to remove those additional routes from the relationshp
url: "{{instance_fqdn}}/api/gateway/v1/http_ports/:id/routes/?page=<integer>&page_size=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: search
    value: <string>
    description: A search term.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this additional route.
settings: {}
examples: ./.resources/http ports routes list.resources/examples
order: 3000
