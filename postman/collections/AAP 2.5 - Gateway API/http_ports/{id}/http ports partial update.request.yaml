$kind: http-request
description: API endpoint that allows groups to be viewed or edited.
url: "{{instance_fqdn}}/api/gateway/v1/http_ports/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this http port.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "number": "<integer>",
      "use_https": "<boolean>",
      "is_api_port": "<boolean>"
    }
settings: {}
examples: ./.resources/http ports partial update.resources/examples
order: 4000
