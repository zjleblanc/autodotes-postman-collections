$kind: http-request
description: API endpoint that allows authenticators to be viewed or edited.
url: "{{instance_fqdn}}/api/gateway/v1/authenticators/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this authenticator.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "enabled": "<boolean>",
      "create_objects": "<boolean>",
      "remove_users": "<boolean>",
      "configuration": {
        "dolore_a": {}
      },
      "type": "aap_gateway_api.authentication.authenticator_plugins.legacy_external_password",
      "order": "<integer>",
      "auto_migrate_users_to": "<integer>"
    }
settings: {}
examples: ./.resources/authenticators partial update.resources/examples
order: 5000
