method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: search
    value: <string>
    description: A search term.
settings: {}
examples: ./.resources/service keys list.resources/examples
