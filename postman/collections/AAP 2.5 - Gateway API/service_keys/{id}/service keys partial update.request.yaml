$kind: http-request
description: API endpoint that allows configuring service authentication keys.
url: "{{instance_fqdn}}/api/gateway/v1/service_keys/:id/"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this service key.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "service_cluster": "<integer>",
      "is_active": "<boolean>",
      "algorithm": "HS256",
      "secret_length": 64,
      "mark_previous_inactive": "<boolean>"
    }
settings: {}
examples: ./.resources/service keys partial update.resources/examples
order: 3000
