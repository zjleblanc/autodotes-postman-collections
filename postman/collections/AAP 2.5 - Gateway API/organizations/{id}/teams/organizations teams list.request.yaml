$kind: http-request
description: |-
  Manage Team objects in the 'teams' relationship of this particular Organization.

  Starting from the detail URL:

  GET /:id/teams/ to show teams currently in the relationship
url: "{{instance_fqdn}}/api/gateway/v1/organizations/:id/teams/?page=<integer>&page_size=<integer>&search=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: <integer>
    description: A page number within the paginated result set.
  - key: page_size
    value: <integer>
    description: Number of results to return per page.
  - key: search
    value: <string>
    description: A search term.
pathVariables:
  - key: id
    value: "1714231316"
    description: "(Required) "
settings: {}
examples: ./.resources/organizations teams list.resources/examples
order: 1000
