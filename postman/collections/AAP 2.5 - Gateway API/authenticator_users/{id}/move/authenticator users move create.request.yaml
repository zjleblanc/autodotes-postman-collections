$kind: http-request
description: API endpoint that allows AuthenticatorUsers to be viewed and listed.
url: "{{instance_fqdn}}/api/gateway/v1/authenticator_users/:id/move/"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this authenticator user.
body:
  type: json
  content: |-
    {
      "keep_memberships": "<boolean>",
      "merge_accounts_with_same_uid": "<boolean>",
      "new_authenticator": "<integer>",
      "remove_other_authenticators": "<boolean>",
      "merge_with_user": "<integer>",
      "new_uid": "<string>"
    }
settings: {}
examples: ./.resources/authenticator users move create.resources/examples
order: 1000
