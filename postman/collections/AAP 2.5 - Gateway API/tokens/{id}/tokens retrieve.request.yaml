$kind: http-request
url: "{{instance_fqdn}}/api/gateway/v1/tokens/:id/"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) A unique integer value identifying this access token.
settings: {}
examples: ./.resources/tokens retrieve.resources/examples
order: 1000
