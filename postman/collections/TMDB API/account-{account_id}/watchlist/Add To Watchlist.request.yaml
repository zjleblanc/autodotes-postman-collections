$kind: http-request
description: Add a movie or TV show to your watchlist.
url: "{{base_url}}/3/account/:account_id/watchlist?session_id=string"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
queryParams:
  session_id: string
pathVariables:
  - key: account_id
    value: ""
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "media_type": "movie",
      "media_id": 11,
      "watchlist": true
    }
settings: {}
examples: ./.resources/Add To Watchlist.resources/examples
order: 1000
