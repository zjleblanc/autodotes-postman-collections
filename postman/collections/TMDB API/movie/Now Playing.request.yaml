$kind: http-request
description: Get a list of movies that are currently in theatres.
url: "{{base_url}}/3/movie/now_playing?language=en-US&page=1&region=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: language
    value: en-US
    disabled: false
  - key: page
    value: "1"
    disabled: false
  - key: region
    value: string
    disabled: false
    description: ISO-3166-1 code
settings: {}
examples: ./.resources/Now Playing.resources/examples
order: 2000
