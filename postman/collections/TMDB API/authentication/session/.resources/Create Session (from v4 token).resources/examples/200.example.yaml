$kind: http-example
request:
  url: "{{base_url}}/3/authentication/session/convert/4"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "<v4_access_token>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '"{\n  \"success\": true,\n  \"session_id\": \"<session_id>\"\n}"'
order: 1000
