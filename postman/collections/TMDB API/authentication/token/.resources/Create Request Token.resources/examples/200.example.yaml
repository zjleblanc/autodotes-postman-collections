$kind: http-example
request:
  url: "{{base_url}}/3/authentication/token/new"
  method: GET
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '"{\n  \"success\": true,\n  \"expires_at\": \"2016-08-26 17:04:39 UTC\",\n  \"request_token\": \"<request_token>\"\n}"'
order: 1000
