$kind: http-example
request:
  url: "{{base_url}}/3/authentication/token/validate_with_login"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "username": "johnny_appleseed",
        "password": "test123",
        "request_token": "1531f1a558c8357ce8990cf887ff196e8f5402ec"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: '"{\n  \"success\": true,\n  \"expires_at\": \"2018-07-24 04:10:26 UTC\",\n  \"request_token\": \"1531f1a558c8357ce8990cf887ff196e8f5402ec\"\n}"'
order: 1000
